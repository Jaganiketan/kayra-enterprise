<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kayra Enterprise - Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f4;color:#222}
.header{background:#064d35;color:#fff;padding:20px;text-align:center}
.header h1{margin:0;font-size:24px}
.header p{margin:6px 0 0;font-size:13px}
.container{max-width:650px;margin:20px auto;padding:15px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h2{color:#064d35;margin-top:0}
label{display:block;margin:14px 0 6px;font-weight:bold}
input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:15px}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:10px;background:#08a65c;color:white;font-size:16px;font-weight:bold}
button:active{transform:scale(.98)}
.logout,.delete{background:#d93025}
.edit{background:#087f5b}
.stock{background:#555}
.message{margin-top:15px;padding:12px;border-radius:10px;text-align:center;font-weight:bold;display:none}
.success{display:block;background:#d9f8e8;color:#08733f}
.error{display:block;background:#ffe1e1;color:#a40000}
.user{background:#e9f8f0;padding:12px;border-radius:10px;margin-bottom:18px}
.product{border:1px solid #ddd;border-radius:14px;padding:15px;margin-top:15px}
.product h3{margin:0;color:#064d35}
.price{font-size:20px;font-weight:bold;color:#08a65c;margin:8px 0}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.back{display:block;text-align:center;color:#064d35;font-weight:bold;text-decoration:none;margin:20px}
#adminPanel{display:none}
</style>
</head>

<body>

<header class="header">
<h1>Kayra Enterprise</h1>
<p>Admin Product Panel</p>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginPanel">

<h2>🔐 Admin Login</h2>

<label>Email</label>
<input type="email" id="loginEmail"
value="jaganiketan2@gmail.com">

<label>Password</label>
<input type="password" id="loginPassword"
placeholder="Enter password">

<button id="loginBtn">🔐 Login</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN -->
<div id="adminPanel">

<div class="card">

<div class="user">
✅ Logged in as:
<strong id="adminEmail"></strong>
</div>

<h2>➕ Add New Product</h2>

<label>Product Name</label>
<input id="productName" placeholder="Example: Coconut Broom">

<label>Category</label>
<select id="productCategory">
<option value="Broom">Broom</option>
<option value="Cleaning">Cleaning</option>
<option value="Other">Other</option>
</select>

<label>Price (₹)</label>
<input type="number" id="productPrice" min="0" placeholder="120">

<label>Image URL</label>
<input type="url" id="productImage"
placeholder="https://example.com/image.jpg">

<label>
<input type="checkbox" id="productStock" checked
style="width:20px">
 Product In Stock
</label>

<button id="addProductBtn">
➕ Add Product
</button>

<div id="message" class="message"></div>

<button class="logout" id="logoutBtn">
🚪 Logout
</button>

</div>


<!-- PRODUCT MANAGEMENT -->

<div class="card">

<h2>📦 Manage Products</h2>

<div id="productsList">
Loading products...
</div>

</div>

</div>

<a class="back" href="index.html">
← Back to Website
</a>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp,
getDocs,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyBe1Gi-atOr6ugqIIHNs5W_8x6DH0oCY9g",
authDomain:"kayraenterprise-8a2ec.firebaseapp.com",
projectId:"kayraenterprise-8a2ec",
storageBucket:"kayraenterprise-8a2ec.firebasestorage.app",
messagingSenderId:"541311529043",
appId:"1:541311529043:web:d8e2300b7290e7caa356a6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const ADMIN_UID="nXHIW6ntWCZilxyxoupg9kgATsy2";


const loginPanel=document.getElementById("loginPanel");
const adminPanel=document.getElementById("adminPanel");
const loginEmail=document.getElementById("loginEmail");
const loginPassword=document.getElementById("loginPassword");
const loginBtn=document.getElementById("loginBtn");
const loginMessage=document.getElementById("loginMessage");
const adminEmail=document.getElementById("adminEmail");

const productName=document.getElementById("productName");
const productCategory=document.getElementById("productCategory");
const productPrice=document.getElementById("productPrice");
const productImage=document.getElementById("productImage");
const productStock=document.getElementById("productStock");
const addProductBtn=document.getElementById("addProductBtn");
const message=document.getElementById("message");
const productsList=document.getElementById("productsList");


function showLogin(text,type){
loginMessage.textContent=text;
loginMessage.className="message "+type;
}

function showMessage(text,type){
message.textContent=text;
message.className="message "+type;
}


/* LOGIN */

loginBtn.onclick=async()=>{

const email=loginEmail.value.trim();
const password=loginPassword.value;

if(!email||!password){
showLogin("Email और password डालें.","error");
return;
}

loginBtn.disabled=true;
loginBtn.textContent="Logging in...";

try{
await signInWithEmailAndPassword(auth,email,password);
}catch(error){
console.error(error);
showLogin("❌ Email या password गलत है.","error");
}

loginBtn.disabled=false;
loginBtn.textContent="🔐 Login";
};


/* AUTH */

onAuthStateChanged(auth,async(user)=>{

if(user){

if(user.uid!==ADMIN_UID){

showLogin("❌ यह Admin account नहीं है.","error");
await signOut(auth);
return;
}

loginPanel.style.display="none";
adminPanel.style.display="block";
adminEmail.textContent=user.email;

loadProducts();

}else{

loginPanel.style.display="block";
adminPanel.style.display="none";

}

});


/* LOGOUT */

document.getElementById("logoutBtn").onclick=()=>{
signOut(auth);
};


/* ADD PRODUCT */

addProductBtn.onclick=async()=>{

const name=productName.value.trim();
const category=productCategory.value;
const price=Number(productPrice.value);
const image=productImage.value.trim();
const stock=productStock.checked;

if(!name){
showMessage("Product name डालें.","error");
return;
}

if(isNaN(price)||price<0){
showMessage("सही price डालें.","error");
return;
}

addProductBtn.disabled=true;
addProductBtn.textContent="Saving...";

try{

await addDoc(collection(db,"products"),{

name:name,
category:category,
price:price,
image:image,
stock:stock,
createdAt:serverTimestamp()

});

showMessage("✅ Product successfully added!","success");

productName.value="";
productPrice.value="";
productImage.value="";
productStock.checked=true;

loadProducts();

}catch(error){

console.error(error);
showMessage("❌ Product add नहीं हुआ.","error");

}

addProductBtn.disabled=false;
addProductBtn.textContent="➕ Add Product";

};


/* LOAD PRODUCTS */

async function loadProducts(){

productsList.innerHTML="Loading products...";

try{

const snapshot=await getDocs(
collection(db,"products")
);

productsList.innerHTML="";

if(snapshot.empty){

productsList.innerHTML="<p>No products found.</p>";
return;

}

snapshot.forEach(item=>{

const data=item.data();

/*
 पुराने product में Name हो सकता है,
 नए product में name है।
 दोनों को support किया गया है।
*/

const name=data.name || data.Name || "Product";
const category=data.category || "Other";
const price=data.price || 0;
const image=data.image || "";
const stock=data.stock===true;

const div=document.createElement("div");
div.className="product";

div.innerHTML=`

<h3>${escapeHTML(name)}</h3>

<p>Category: ${escapeHTML(category)}</p>

<div class="price">₹${price}</div>

<p>
${stock ? "🟢 In Stock" : "🔴 Out of Stock"}
</p>

<div class="actions">

<button class="edit">
✏️ Edit
</button>

<button class="delete">
🗑️ Delete
</button>

</div>

<button class="stock">
${stock ? "📦 Mark Out of Stock" : "📦 Mark In Stock"}
</button>

`;

const editBtn=div.querySelector(".edit");
const deleteBtn=div.querySelector(".delete");
const stockBtn=div.querySelector(".stock");


editBtn.onclick=()=>editProduct(
item.id,
data
);

deleteBtn.onclick=()=>deleteProduct(
item.id,
name
);

stockBtn.onclick=()=>toggleStock(
item.id,
stock
);

productsList.appendChild(div);

});

}catch(error){

console.error(error);

productsList.innerHTML=
"<p>❌ Products load नहीं हुए.</p>";

}

}


/* EDIT */

async function editProduct(id,data){

const oldName=data.name || data.Name || "";
const oldPrice=data.price || 0;
const oldCategory=data.category || "Other";
const oldImage=data.image || "";

const newName=prompt(
"Product Name:",
oldName
);

if(newName===null)return;

const newPrice=prompt(
"Price:",
oldPrice
);

if(newPrice===null)return;

const newCategory=prompt(
"Category:",
oldCategory
);

if(newCategory===null)return;

const newImage=prompt(
"Image URL:",
oldImage
);

if(newImage===null)return;

try{

await updateDoc(
doc(db,"products",id),
{
name:newName.trim(),
price:Number(newPrice),
category:newCategory.trim(),
image:newImage.trim()
}
);

alert("✅ Product updated successfully!");

loadProducts();

}catch(error){

console.error(error);

alert("❌ Product update नहीं हुआ.");

}

}


/* DELETE */

async function deleteProduct(id,name){

const confirmDelete=confirm(
`क्या आप "${name}" को delete करना चाहते हैं?`
);

if(!confirmDelete)return;

try{

await deleteDoc(
doc(db,"products",id)
);

alert("✅ Product deleted!");

loadProducts();

}catch(error){

console.error(error);

alert("❌ Product delete नहीं हुआ.");

}

}


/* STOCK */

async function toggleStock(id,currentStock){

try{

await updateDoc(
doc(db,"products",id),
{
stock:!currentStock
}
);

loadProducts();

}catch(error){

console.error(error);

alert("❌ Stock update नहीं हुआ.");

}

}


/* SECURITY */

function escapeHTML(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
    </html>
