<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kayra Enterprise - Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f5f4;
color:#222
}

.header{
background:#064d35;
color:#fff;
padding:20px;
text-align:center
}

.header h1{
margin:0;
font-size:24px
}

.header p{
margin:6px 0 0;
font-size:13px
}

.container{
max-width:650px;
margin:20px auto;
padding:15px
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 18px rgba(0,0,0,.08)
}

h2{
color:#064d35;
margin-top:0
}

label{
display:block;
margin:14px 0 6px;
font-weight:bold
}

input,select{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px
}

button{
width:100%;
padding:13px;
margin-top:15px;
border:0;
border-radius:10px;
background:#08a65c;
color:white;
font-size:16px;
font-weight:bold
}

button:active{
transform:scale(.98)
}

button:disabled{
opacity:.6
}

.logout,.delete{
background:#d93025
}

.edit{
background:#087f5b
}

.stock{
background:#555
}

.message{
margin-top:15px;
padding:12px;
border-radius:10px;
text-align:center;
font-weight:bold;
display:none
}

.success{
display:block;
background:#d9f8e8;
color:#08733f
}

.error{
display:block;
background:#ffe1e1;
color:#a40000
}

.user{
background:#e9f8f0;
padding:12px;
border-radius:10px;
margin-bottom:18px
}

.product{
border:1px solid #ddd;
border-radius:14px;
padding:15px;
margin-top:15px
}

.product h3{
margin:0;
color:#064d35
}

.product-image{
width:100%;
height:200px;
object-fit:cover;
border-radius:12px;
margin-bottom:12px;
background:#f1f1f1
}

.price{
font-size:20px;
font-weight:bold;
color:#08a65c;
margin:8px 0
}

.actions{
display:flex;
gap:8px
}

.actions button{
flex:1
}

.back{
display:block;
text-align:center;
color:#064d35;
font-weight:bold;
text-decoration:none;
margin:20px
}

#adminPanel{
display:none
}

.photo-box{
border:2px dashed #08a65c;
border-radius:14px;
padding:20px;
text-align:center;
background:#f3fff9;
margin-top:8px
}

.photo-box input{
border:0;
padding:5px;
background:transparent
}

.preview{
display:none;
width:100%;
max-height:250px;
object-fit:contain;
margin-top:15px;
border-radius:12px
}

.upload-status{
font-size:14px;
margin-top:10px;
color:#08733f;
font-weight:bold
}

.small-note{
font-size:12px;
color:#666;
margin-top:8px;
line-height:1.5
}
</style>
</head>

<body>

<header class="header">
<h1>Kayra Enterprise</h1>
<p>Admin Product Panel</p>
</header>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginPanel">

<h2>🔐 Admin Login</h2>

<label>Email</label>

<input
type="email"
id="loginEmail"
value="jaganiketan2@gmail.com"
>

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter password"
>

<button id="loginBtn">
🔐 Login
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN -->

<div id="adminPanel">

<div class="card">

<div class="user">
✅ Logged in as:
<strong id="adminEmail"></strong>
</div>

<h2>➕ Add New Product</h2>


<label>Product Name</label>

<input
id="productName"
placeholder="Example: Coconut Broom"
>


<label>Category</label>

<select id="productCategory">

<option value="Broom">
Broom
</option>

<option value="Cleaning">
Cleaning
</option>

<option value="Other">
Other
</option>

</select>


<label>Price (₹)</label>

<input
type="number"
id="productPrice"
min="0"
placeholder="120"
>


<!-- PHOTO UPLOAD -->

<label>
📷 Product Photo
</label>

<div class="photo-box">

<strong>
Select photo from your mobile Gallery
</strong>

<input
type="file"
id="productPhoto"
accept="image/*"
>

<img
id="photoPreview"
class="preview"
>

<div
id="uploadStatus"
class="upload-status">
</div>

<div class="small-note">
Photo automatically Cloudinary पर upload होगी।
फिर उसका URL Firebase में save होगा।
</div>

</div>


<label>

<input
type="checkbox"
id="productStock"
checked
style="width:20px"
>

Product In Stock

</label>


<button id="addProductBtn">
➕ Add Product
</button>

<div id="message" class="message"></div>


<button
class="logout"
id="logoutBtn"
>
🚪 Logout
</button>

</div>


<!-- PRODUCT MANAGEMENT -->

<div class="card">

<h2>
📦 Manage Products
</h2>

<div id="productsList">
Loading products...
</div>

</div>

</div>


<a
class="back"
href="index.html"
>
← Back to Website
</a>

</div>


<script type="module">

/* ============================
   FIREBASE
============================ */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
serverTimestamp,
getDocs,
doc,
updateDoc,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ============================
   FIREBASE CONFIG
============================ */

const firebaseConfig={

apiKey:
"AIzaSyBe1Gi-atOr6ugqIIHNs5W_8x6DH0oCY9g",

authDomain:
"kayraenterprise-8a2ec.firebaseapp.com",

projectId:
"kayraenterprise-8a2ec",

storageBucket:
"kayraenterprise-8a2ec.firebasestorage.app",

messagingSenderId:
"541311529043",

appId:
"1:541311529043:web:d8e2300b7290e7caa356a6"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);


/* ============================
   ADMIN UID
============================ */

const ADMIN_UID=
"nXHIW6ntWCZilxyxoupg9kgATsy2";


/* ============================
   CLOUDINARY
============================ */

const CLOUDINARY_CLOUD_NAME=
"dzasxahe9";

const CLOUDINARY_UPLOAD_PRESET=
"shopupload";


/* ============================
   ELEMENTS
============================ */

const loginPanel=
document.getElementById("loginPanel");

const adminPanel=
document.getElementById("adminPanel");

const loginEmail=
document.getElementById("loginEmail");

const loginPassword=
document.getElementById("loginPassword");

const loginBtn=
document.getElementById("loginBtn");

const loginMessage=
document.getElementById("loginMessage");

const adminEmail=
document.getElementById("adminEmail");


const productName=
document.getElementById("productName");

const productCategory=
document.getElementById("productCategory");

const productPrice=
document.getElementById("productPrice");

const productPhoto=
document.getElementById("productPhoto");

const photoPreview=
document.getElementById("photoPreview");

const uploadStatus=
document.getElementById("uploadStatus");

const productStock=
document.getElementById("productStock");

const addProductBtn=
document.getElementById("addProductBtn");

const message=
document.getElementById("message");

const productsList=
document.getElementById("productsList");


/* ============================
   PHOTO PREVIEW
============================ */

productPhoto.addEventListener(
"change",
function(){

const file=
productPhoto.files[0];

if(!file){

photoPreview.style.display="none";
uploadStatus.textContent="";
return;

}


/* File type */

if(!file.type.startsWith("image/")){

uploadStatus.textContent=
"❌ केवल image select करें.";

productPhoto.value="";

return;

}


/* File size */

if(file.size>10*1024*1024){

uploadStatus.textContent=
"❌ Photo 10MB से छोटी होनी चाहिए.";

productPhoto.value="";

return;

}


const reader=
new FileReader();


reader.onload=function(e){

photoPreview.src=
e.target.result;

photoPreview.style.display=
"block";

uploadStatus.textContent=
"✅ Photo selected. अब Add Product दबाएँ.";

};


reader.readAsDataURL(file);

});


/* ============================
   MESSAGE
============================ */

function showLogin(text,type){

loginMessage.textContent=
text;

loginMessage.className=
"message "+type;

}


function showMessage(text,type){

message.textContent=
text;

message.className=
"message "+type;

}


/* ============================
   LOGIN
============================ */

loginBtn.onclick=
async()=>{

const email=
loginEmail.value.trim();

const password=
loginPassword.value;


if(!email||!password){

showLogin(
"Email और password डालें.",
"error"
);

return;

}


loginBtn.disabled=true;

loginBtn.textContent=
"Logging in...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

console.error(error);

showLogin(
"❌ Email या password गलत है.",
"error"
);

}


loginBtn.disabled=false;

loginBtn.textContent=
"🔐 Login";

};


/* ============================
   AUTH
============================ */

onAuthStateChanged(
auth,
async(user)=>{

if(user){

if(user.uid!==ADMIN_UID){

showLogin(
"❌ यह Admin account नहीं है.",
"error"
);

await signOut(auth);

return;

}


loginPanel.style.display=
"none";

adminPanel.style.display=
"block";

adminEmail.textContent=
user.email;

loadProducts();


}else{

loginPanel.style.display=
"block";

adminPanel.style.display=
"none";

}

});


/* ============================
   LOGOUT
============================ */

document.getElementById(
"logoutBtn"
).onclick=()=>{

signOut(auth);

};


/* ============================
   CLOUDINARY UPLOAD
============================ */

async function uploadToCloudinary(file){

const url=
`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;


const formData=
new FormData();


formData.append(
"file",
file
);


formData.append(
"upload_preset",
CLOUDINARY_UPLOAD_PRESET
);


const response=
await fetch(
url,
{
method:"POST",
body:formData
}
);


if(!response.ok){

throw new Error(
"Cloudinary upload failed"
);

}


const data=
await response.json();


return data.secure_url;

}


/* ============================
   ADD PRODUCT
============================ */

addProductBtn.onclick=
async()=>{

const name=
productName.value.trim();

const category=
productCategory.value;

const price=
Number(productPrice.value);

const file=
productPhoto.files[0];

const stock=
productStock.checked;


if(!name){

showMessage(
"Product name डालें.",
"error"
);

return;

}


if(isNaN(price)||price<0){

showMessage(
"सही price डालें.",
"error"
);

return;

}


if(!file){

showMessage(
"📷 Product photo select करें.",
"error"
);

return;

}


addProductBtn.disabled=true;

addProductBtn.textContent=
"Uploading Photo...";

uploadStatus.textContent=
"⏳ Photo Cloudinary पर upload हो रही है...";


try{


/* UPLOAD PHOTO */

const imageUrl=
await uploadToCloudinary(file);


uploadStatus.textContent=
"✅ Photo uploaded successfully!";


/* SAVE FIREBASE */

addProductBtn.textContent=
"Saving Product...";


await addDoc(
collection(db,"products"),
{

name:name,

category:category,

price:price,

image:imageUrl,

stock:stock,

createdAt:
serverTimestamp()

}
);


showMessage(
"✅ Product successfully added!",
"success"
);


/* CLEAR */

productName.value="";

productPrice.value="";

productPhoto.value="";

photoPreview.src="";

photoPreview.style.display=
"none";

uploadStatus.textContent="";

productStock.checked=true;


loadProducts();


}catch(error){

console.error(error);

showMessage(
"❌ Photo या Product save नहीं हुआ.",
"error"
);

uploadStatus.textContent=
"❌ Upload failed.";

}


addProductBtn.disabled=false;

addProductBtn.textContent=
"➕ Add Product";

};


/* ============================
   LOAD PRODUCTS
============================ */

async function loadProducts(){

productsList.innerHTML=
"Loading products...";


try{

const snapshot=
await getDocs(
collection(db,"products")
);


productsList.innerHTML="";


if(snapshot.empty){

productsList.innerHTML=
"<p>No products found.</p>";

return;

}


snapshot.forEach(item=>{

const data=
item.data();


const name=
data.name||
data.Name||
"Product";


const category=
data.category||
"Other";


const price=
data.price||
0;


const image=
data.image||
"";


const stock=
data.stock===true;


const div=
document.createElement("div");


div.className=
"product";


div.innerHTML=`

${
image
?
`
<img
class="product-image"
src="${escapeHTML(image)}"
alt="${escapeHTML(name)}"
>
`
:
""
}

<h3>
${escapeHTML(name)}
</h3>

<p>
Category:
${escapeHTML(category)}
</p>

<div class="price">
₹${price}
</div>

<p>
${
stock
?
"🟢 In Stock"
:
"🔴 Out of Stock"
}
</p>

<div class="actions">

<button class="edit">
✏️ Edit
</button>

<button class="delete">
🗑️ Delete
</button>

</div>

<button class="stock">

${
stock
?
"📦 Mark Out of Stock"
:
"📦 Mark In Stock"
}

</button>

`;


const editBtn=
div.querySelector(".edit");

const deleteBtn=
div.querySelector(".delete");

const stockBtn=
div.querySelector(".stock");


editBtn.onclick=
()=>editProduct(
item.id,
data
);


deleteBtn.onclick=
()=>deleteProduct(
item.id,
name
);


stockBtn.onclick=
()=>toggleStock(
item.id,
stock
);


productsList.appendChild(div);

});


}catch(error){

console.error(error);

productsList.innerHTML=
"<p>❌ Products load नहीं हुए.</p>";

}

}


/* ============================
   EDIT
============================ */

async function editProduct(
id,
data
){

const oldName=
data.name||
data.Name||
"";


const oldPrice=
data.price||
0;


const oldCategory=
data.category||
"Other";


const newName=
prompt(
"Product Name:",
oldName
);


if(newName===null)return;


const newPrice=
prompt(
"Price:",
oldPrice
);


if(newPrice===null)return;


const newCategory=
prompt(
"Category:",
oldCategory
);


if(newCategory===null)return;


try{

await updateDoc(
doc(db,"products",id),
{

name:
newName.trim(),

price:
Number(newPrice),

category:
newCategory.trim()

}
);


alert(
"✅ Product updated successfully!"
);


loadProducts();


}catch(error){

console.error(error);

alert(
"❌ Product update नहीं हुआ."
);

}

}


/* ============================
   DELETE
============================ */

async function deleteProduct(
id,
name
){

const confirmDelete=
confirm(
`क्या आप "${name}" को delete करना चाहते हैं?`
);


if(!confirmDelete)return;


try{

await deleteDoc(
doc(db,"products",id)
);


alert(
"✅ Product deleted!"
);


loadProducts();


}catch(error){

console.error(error);

alert(
"❌ Product delete नहीं हुआ."
);

}

}


/* ============================
   STOCK
============================ */

async function toggleStock(
id,
currentStock
){

try{

await updateDoc(
doc(db,"products",id),
{

stock:
!currentStock

}
);


loadProducts();


}catch(error){

console.error(error);

alert(
"❌ Stock update नहीं हुआ."
);

}

}


/* ============================
   SECURITY
============================ */

function escapeHTML(text){

return String(text)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}

</script>

</body>
 </html>
