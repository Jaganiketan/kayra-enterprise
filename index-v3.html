<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kayra Enterprise V3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f6;
  color:#222
}

.head{
  background:#064d35;
  color:#fff;
  padding:18px;
  text-align:center
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:12px
}

.tools{
  background:#fff;
  padding:12px;
  border-radius:14px;
  margin:12px 0
}

.tools input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px
}

.cats{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:7px 0
}

.cat{
  white-space:nowrap;
  border:0;
  border-radius:20px;
  padding:9px 13px;
  background:#e9f4ef
}

.cat.active{
  background:#064d35;
  color:#fff
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

@media(min-width:750px){
  .grid{
    grid-template-columns:repeat(4,1fr)
  }
}

.card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 10px #0001
}

.card img{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#f5f5f5
}

.body{
  padding:10px
}

.price{
  font-weight:bold;
  color:#087f5b;
  font-size:18px
}

.old{
  text-decoration:line-through;
  color:#888;
  font-size:13px
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px;
  font-weight:bold;
  cursor:pointer
}

.wa{
  background:#08a65c;
  color:#fff;
  width:100%;
  margin-top:8px
}

.orderBtn{
  background:#064d35;
  color:#fff;
  width:100%;
  margin-top:8px
}

.cancelBtn{
  background:#eee;
  color:#222;
  width:100%;
  margin-top:7px
}

.wish{
  background:#eee;
  width:100%;
  margin-top:6px
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:10
}

.box{
  background:#fff;
  border-radius:15px;
  max-width:600px;
  width:100%;
  max-height:92vh;
  overflow:auto;
  padding:16px
}

.box img{
  width:100%;
  max-height:350px;
  object-fit:contain
}

.thumbs{
  display:flex;
  gap:5px;
  overflow:auto;
  margin:8px 0
}

.thumb{
  width:60px!important;
  height:60px!important;
  object-fit:cover!important;
  border-radius:7px;
  cursor:pointer
}

.orderBox{
  background:#fff;
  border-radius:16px;
  width:100%;
  max-width:550px;
  padding:20px;
  max-height:90vh;
  overflow:auto
}

.orderBox h2{
  color:#064d35;
  margin-top:0
}

.orderBox input{
  width:100%;
  padding:13px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px
}

.orderProduct{
  background:#f1f8f4;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px
}

.msg{
  margin:8px 0;
  padding:10px;
  border-radius:8px;
  display:none
}

.msg.ok{
  display:block;
  background:#e4f7ec;
  color:#087f5b
}

.msg.err{
  display:block;
  background:#ffe5e5;
  color:#b00020
}

.popup{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 5px 30px #0005;
  z-index:30;
  display:none
}

.popup input{
  width:100%;
  padding:11px;
  margin:5px 0;
  border:1px solid #ccc;
  border-radius:8px
}

.check{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:12px
}

.check input{
  width:auto
}

.muted{
  font-size:12px;
  color:#666
}

.loading{
  text-align:center;
  padding:30px
}
</style>
</head>

<body>

<div class="head">
  <h2 style="margin:0">Kayra Enterprise</h2>
  <div>New Collection & Offers</div>
</div>

<div class="wrap">

  <div class="tools">
    <input id="search" placeholder="🔎 Search products...">
    <div id="cats" class="cats"></div>
  </div>

  <div id="products" class="grid">
    <div class="loading">Loading products...</div>
  </div>

</div>


<!-- =====================================================
     PRODUCT DETAILS MODAL
===================================================== -->

<div id="productModal" class="modal">

  <div class="box">

    <button id="close" class="btn">
      ✕ Close
    </button>

    <div id="detail"></div>

  </div>

</div>


<!-- =====================================================
     ORDER MODAL
===================================================== -->

<div id="orderModal" class="modal">

  <div class="orderBox">

    <h2>🛒 Place Your Order</h2>

    <div id="orderProduct" class="orderProduct"></div>

    <label>
      <b>Customer Name *</b>
      <input
        id="orderName"
        type="text"
        maxlength="100"
        placeholder="आपका नाम">
    </label>

    <label>
      <b>WhatsApp Number *</b>
      <input
        id="orderPhone"
        type="tel"
        inputmode="numeric"
        maxlength="15"
        placeholder="WhatsApp Number">
    </label>

    <label>
      <b>Quantity *</b>
      <input
        id="orderQty"
        type="number"
        min="1"
        max="100"
        value="1">
    </label>

    <div id="orderTotal"
         style="font-size:20px;font-weight:bold;color:#087f5b;margin:10px 0">
    </div>

    <div id="orderMsg" class="msg"></div>

    <button id="submitOrder"
            class="btn orderBtn">
      💬 Submit Order
    </button>

    <button id="closeOrder"
            class="btn cancelBtn">
      Cancel
    </button>

  </div>

</div>


<!-- =====================================================
     MARKETING POPUP
===================================================== -->

<div id="subscribe" class="popup">

  <h2 style="margin-top:0;color:#064d35">
    🎁 नई Collection सबसे पहले पाएं!
  </h2>

  <p>
    New products और special offers की जानकारी
    WhatsApp पर पाने के लिए जुड़ें।
  </p>

  <input
    id="cname"
    placeholder="आपका नाम"
    maxlength="80">

  <input
    id="cphone"
    placeholder="WhatsApp Number"
    inputmode="tel"
    maxlength="20">

  <label class="check">
    <input id="consent" type="checkbox">
    मैं Kayra Enterprise से नए products और offers की
    WhatsApp updates प्राप्त करने के लिए सहमत हूँ।
  </label>

  <button id="join" class="btn wa">
    मुझे जोड़ें
  </button>

  <button id="skip"
          class="btn"
          style="width:100%;margin-top:5px">
    अभी नहीं
  </button>

  <div id="submsg" class="muted"></div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import { db } from "./firebase.js";

import {
  collection,
  getDocs,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   HELPERS
===================================================== */

const $ = id => document.getElementById(id);

const esc = x =>
  String(x ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

const money = x =>
  "₹" + Number(x || 0).toLocaleString("en-IN");


/* =====================================================
   DATA
===================================================== */

let products = [];
let categories = [];
let selected = "";

let selectedProduct = null;


/* =====================================================
   LOAD PRODUCTS + CATEGORIES
===================================================== */

async function init(){

  try{

    const [p,c] = await Promise.all([

      getDocs(
        collection(db,"products")
      ),

      getDocs(
        collection(db,"categories")
      )

    ]);

    products = p.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    categories = c.docs.map(d => ({
      id:d.id,
      ...d.data()
    }));

    renderCats();
    render();

  }catch(e){

    console.error("Website loading error:",e);

    $("products").innerHTML =
      "<p>Products load नहीं हो पाए। Please refresh.</p>";

  }

}


/* =====================================================
   CATEGORIES
===================================================== */

function renderCats(){

  const active =
    categories.filter(c =>
      c.active !== false &&
      products.some(p =>
        p.categoryId === c.id ||
        p.category === c.name
      )
    );

  $("cats").innerHTML =

    `<button
      class="cat ${!selected ? "active":""}"
      data-cat="">
      All
    </button>`

    +

    active.map(c =>

      `<button
        class="cat ${selected===c.id ? "active":""}"
        data-cat="${esc(c.id)}">
        ${esc(c.name)}
      </button>`

    ).join("");

  document
    .querySelectorAll("[data-cat]")
    .forEach(b => {

      b.onclick = () => {

        selected = b.dataset.cat;

        renderCats();
        render();

      };

    });

}


/* =====================================================
   PRODUCT LIST
===================================================== */

function render(){

  const q =
    $("search").value
      .toLowerCase()
      .trim();

  const arr = products.filter(p =>

    p.stock !== false &&

    (!selected ||
      p.categoryId === selected) &&

    (!q ||
      JSON.stringify(p)
        .toLowerCase()
        .includes(q))

  );

  $("products").innerHTML =

    arr.map(p => {

      const im =
        p.images?.[0] ||
        p.image ||
        "";

      const pr =
        Number(p.price || 0);

      const of =
        Number(p.offerPrice || 0);

      const final =
        of > 0 && of < pr
          ? of
          : pr;

      return `

        <div class="card">

          <img
            src="${esc(im)}"
            alt="${esc(p.name)}">

          <div class="body">

            <b>
              ${esc(p.name)}
            </b>

            <div class="muted">
              ${esc(p.category || "")}
            </div>

            <div class="price">

              ${money(final)}

              ${
                of > 0 && of < pr
                ?
                `<span class="old">
                  ${money(pr)}
                </span>`
                :
                ""
              }

            </div>

            <button
              class="btn wa"
              data-view="${esc(p.id)}">
              View & Order
            </button>

          </div>

        </div>

      `;

    }).join("")

    ||

    "<p>No products found.</p>";


  document
    .querySelectorAll("[data-view]")
    .forEach(b => {

      b.onclick =
        () => openProduct(b.dataset.view);

    });

}


/* =====================================================
   SEARCH
===================================================== */

$("search").oninput = render;


/* =====================================================
   OPEN PRODUCT DETAILS
===================================================== */

function openProduct(id){

  const p =
    products.find(x => x.id === id);

  if(!p) return;

  selectedProduct = p;

  const ims =
    p.images?.filter(Boolean)
    ||
    (p.image ? [p.image] : []);

  const pr =
    Number(p.price || 0);

  const of =
    Number(p.offerPrice || 0);

  const final =
    of > 0 && of < pr
      ? of
      : pr;


  const msg =
    encodeURIComponent(
      `Hello Kayra Enterprise, I want to order:
Product: ${p.name}
Price: ₹${final}
SKU: ${p.sku || ""}`
    );


  $("detail").innerHTML = `

    <img
      id="mainImg"
      src="${esc(ims[0] || "")}"
      alt="${esc(p.name)}">

    <div class="thumbs">

      ${ims.map(u => `

        <img
          class="thumb"
          data-img="${esc(u)}"
          src="${esc(u)}">

      `).join("")}

    </div>

    <h2>
      ${esc(p.name)}
    </h2>

    <div class="price">

      ${money(final)}

      ${
        of > 0 && of < pr
        ?
        `<span class="old">
          ${money(pr)}
        </span>`
        :
        ""
      }

    </div>

    <p>
      ${esc(p.description || "")}
    </p>

    <p class="muted">
      Stock: ${Number(p.stockQty || 0)}
    </p>

    <button
      id="detailOrderBtn"
      class="btn orderBtn">
      🛒 Place Your Order
    </button>

    <a
      class="btn wa"
      style="display:block;text-align:center;text-decoration:none"
      target="_blank"
      href="https://wa.me/?text=${msg}">
      💬 Order on WhatsApp
    </a>

  `;


  $("productModal").style.display =
    "flex";


  document
    .querySelectorAll("[data-img]")
    .forEach(x => {

      x.onclick = () => {

        $("mainImg").src =
          x.dataset.img;

      };

    });


  $("detailOrderBtn").onclick =
    () => openOrder(p);

}


/* =====================================================
   CLOSE PRODUCT
===================================================== */

$("close").onclick = () => {

  $("productModal").style.display =
    "none";

};


/* =====================================================
   OPEN ORDER POPUP
===================================================== */

function openOrder(p){

  selectedProduct = p;

  const pr =
    Number(p.price || 0);

  const of =
    Number(p.offerPrice || 0);

  const final =
    of > 0 && of < pr
      ? of
      : pr;


  $("orderProduct").innerHTML = `

    <b>
      ${esc(p.name)}
    </b>

    <div style="margin-top:5px">
      Price: <b>${money(final)}</b>
    </div>

    ${
      p.sku
      ?
      `<div class="muted">
        SKU: ${esc(p.sku)}
      </div>`
      :
      ""
    }

  `;


  $("orderQty").value = "1";

  $("orderName").value = "";

  $("orderPhone").value = "";

  $("orderMsg").className = "msg";

  $("orderMsg").textContent = "";

  updateOrderTotal();


  $("productModal").style.display =
    "none";

  $("orderModal").style.display =
    "flex";

}


/* =====================================================
   ORDER TOTAL
===================================================== */

function updateOrderTotal(){

  if(!selectedProduct) return;

  const pr =
    Number(selectedProduct.price || 0);

  const of =
    Number(selectedProduct.offerPrice || 0);

  const final =
    of > 0 && of < pr
      ? of
      : pr;

  let qty =
    Number($("orderQty").value || 1);

  if(qty < 1) qty = 1;

  if(qty > 100) qty = 100;

  $("orderTotal").textContent =
    `Total: ${money(final * qty)}`;

}


$("orderQty").oninput =
  updateOrderTotal;


/* =====================================================
   CLOSE ORDER
===================================================== */

$("closeOrder").onclick = () => {

  $("orderModal").style.display =
    "none";

};


/* =====================================================
   SUBMIT ORDER
===================================================== */

$("submitOrder").onclick =
  async () => {

    if(!selectedProduct){

      return showOrderError(
        "Product select नहीं हुआ।"
      );

    }


    const name =
      $("orderName")
        .value
        .trim();

    const phone =
      $("orderPhone")
        .value
        .replace(/\D/g,"");

    let quantity =
      Number(
        $("orderQty").value
      );


    if(!name){

      return showOrderError(
        "Customer name डालें।"
      );

    }


    if(phone.length < 8){

      return showOrderError(
        "Valid WhatsApp number डालें।"
      );

    }


    if(!Number.isFinite(quantity) ||
       quantity < 1 ||
       quantity > 100){

      return showOrderError(
        "Quantity 1 से 100 के बीच होनी चाहिए।"
      );

    }


    const pr =
      Number(selectedProduct.price || 0);

    const of =
      Number(selectedProduct.offerPrice || 0);

    const final =
      of > 0 && of < pr
        ? of
        : pr;

    const total =
      final * quantity;


    const button =
      $("submitOrder");

    button.disabled = true;

    button.textContent =
      "Saving Order...";


    try{

      /* =========================================
         FIRESTORE ORDER
      ========================================= */

      await addDoc(
        collection(db,"orders"),
        {

          customerName:name,

          name:name,

          phone:phone,

          mobile:phone,

          productName:
            selectedProduct.name || "",

          product:
            selectedProduct.name || "",

          productId:
            selectedProduct.id || "",

          quantity:quantity,

          price:final,

          total:total,

          amount:total,

          status:"pending",

          createdAt:
            serverTimestamp()

        }
      );


      /* =========================================
         SUCCESS
      ========================================= */

      $("orderMsg").className =
        "msg ok";

      $("orderMsg").textContent =
        "✅ Order successfully placed!";


      button.textContent =
        "✅ Order Placed";


      /*
       * थोड़ी देर बाद popup बंद
       */

      setTimeout(() => {

        $("orderModal").style.display =
          "none";

        button.disabled = false;

        button.textContent =
          "💬 Submit Order";

      },1500);


}catch(e){

  console.error("ORDER SAVE ERROR CODE:", e.code);
  console.error("ORDER SAVE ERROR MESSAGE:", e.message);
  console.error("FULL ERROR:", e);

  $("orderMsg").className = "msg err";

  $("orderMsg").textContent =
    "❌ " + (e.code || "ERROR") +
    ": " +
    (e.message || "Unknown error");

  button.disabled = false;
  button.textContent = "💬 Submit Order";
    }

  };


/* =====================================================
   ORDER ERROR
===================================================== */

function showOrderError(text){

  $("orderMsg").className =
    "msg err";

  $("orderMsg").textContent =
    "❌ " + text;

}


/* =====================================================
   MARKETING POPUP
===================================================== */

function maybePopup(){

  if(
    localStorage.getItem(
      "kayra_marketing_subscribed"
    ) === "1"
  )

    return;


  if(
    localStorage.getItem(
      "kayra_marketing_dismissed"
    ) === "1"
  )

    return;


  setTimeout(() => {

    $("subscribe").style.display =
      "block";

  },5000);

}


/* =====================================================
   SKIP MARKETING
===================================================== */

$("skip").onclick = () => {

  localStorage.setItem(
    "kayra_marketing_dismissed",
    "1"
  );

  $("subscribe").style.display =
    "none";

};


/* =====================================================
   MARKETING JOIN
===================================================== */

$("join").onclick =
  async () => {

    const name =
      $("cname")
        .value
        .trim();

    const phone =
      $("cphone")
        .value
        .replace(/\D/g,"");

    const consent =
      $("consent").checked;


    if(
      !name ||
      phone.length < 8 ||
      !consent
    ){

      $("submsg").textContent =
        "नाम, valid WhatsApp number और consent जरूरी है.";

      return;

    }


    try{

      await addDoc(
        collection(db,"customers"),
        {

          name:name,

          phone:phone,

          whatsapp:phone,

          marketingConsent:true,

          consentAt:
            serverTimestamp(),

          source:
            "website_popup",

          createdAt:
            serverTimestamp()

        }
      );


      localStorage.setItem(
        "kayra_marketing_subscribed",
        "1"
      );


      $("subscribe").style.display =
        "none";


      alert(
        "✅ आप updates list में जुड़ गए हैं।"
      );


    }catch(e){

      console.error(
        "CUSTOMER SAVE ERROR:",
        e
      );

      $("submsg").textContent =
        "Registration failed: " +
        (e.message || "Please try again.");

    }

  };


/* =====================================================
   START
===================================================== */

init().then(() => {

  maybePopup();

});

</script>

</body>
  </html>
